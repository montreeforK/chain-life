<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05060b" />
  <title>链上生命 · On-Chain Life</title>

  <style>
    :root {
      --bg: #05060b;
      --panel: rgba(12, 15, 25, .68);
      --line: rgba(255, 255, 255, .13);
      --text: rgba(255, 255, 255, .92);
      --soft: rgba(255, 255, 255, .56);
      --muted: rgba(255, 255, 255, .32);
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: var(--font);
    }

    body {
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 50% 48%,
          rgba(75, 92, 180, .16),
          rgba(19, 24, 53, .08) 32%,
          transparent 70%
        ),
        #05060b;
    }

    #app::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .3;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse at center, #000, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000, transparent 72%);
    }

    #canvas-wrap {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .glass {
      border: 1px solid var(--line);
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
      );
      box-shadow:
        0 24px 80px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(26px) saturate(135%);
      -webkit-backdrop-filter: blur(26px) saturate(135%);
    }

    .history-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .history-chip {
      padding: 3px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.55);
      font-family: monospace;
      font-size: 10px;
      cursor: pointer;
      transition: all .25s ease;
    }

    .history-chip:hover {
      border-color: rgba(255,255,255,.35);
      color: rgba(255,255,255,.9);
      background: rgba(255,255,255,.1);
    }

    .small-button.mint {
      color: #8be8a0;
      border-color: rgba(139,232,160,.35);
      background: rgba(139,232,160,.08);
    }

    .small-button.mint:hover {
      background: rgba(139,232,160,.16);
      box-shadow: 0 0 14px rgba(139,232,160,.25);
    }

    .stats, .analysis {
      transition: box-shadow .5s ease;
    }

    .stats:hover, .analysis:hover {
      box-shadow:
        0 24px 80px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.12),
        0 0 28px rgba(120,160,255,.08);
    }

    .panel {
      position: absolute;
      top: 26px;
      left: 50%;
      width: min(650px, calc(100vw - 30px));
      padding: 20px;
      border-radius: 25px;
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .33em;
      text-transform: uppercase;
    }

    h1 {
      margin: 9px 0 0;
      font-size: 27px;
      font-weight: 300;
      letter-spacing: -.08em;
      line-height: 1;
    }

    .address-preview {
      max-width: 190px;
      overflow: hidden;
      color: var(--soft);
      font-family: monospace;
      font-size: 10px;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .address-label {
      margin-bottom: 6px;
      color: var(--muted);
      font-family: var(--font);
      font-size: 8px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input {
      min-width: 0;
      flex: 1;
      height: 49px;
      padding: 0 15px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 15px;
      outline: none;
      color: rgba(255,255,255,.86);
      background: rgba(0,0,0,.2);
      font-family: monospace;
      font-size: 11px;
      transition: .25s ease;
    }

    input::placeholder {
      color: rgba(255,255,255,.25);
    }

    input:focus {
      border-color: rgba(145,165,255,.7);
      background: rgba(35,42,75,.35);
      box-shadow: 0 0 0 4px rgba(130,150,255,.08);
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: var(--font);
    }

    .generate {
      height: 49px;
      padding: 0 20px;
      border-radius: 15px;
      color: #080910;
      background: #f4f6ff;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      transition: .2s ease;
    }

    .generate:hover {
      background: #fff;
      box-shadow: 0 0 28px rgba(175,190,255,.22);
    }

    .generate:active {
      transform: scale(.97);
    }

    .footer-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      color: var(--muted);
      font-size: 10px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #9daeff;
      box-shadow: 0 0 14px #9daeff;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    .actions {
      display: flex;
      gap: 15px;
    }

    .small-button {
      padding: 0;
      color: rgba(255,255,255,.46);
      background: transparent;
      font-size: 10px;
    }

    .small-button:hover {
      color: white;
    }

    .stats {
      position: absolute;
      left: 26px;
      bottom: 26px;
      width: 250px;
      padding: 17px;
      border-radius: 20px;
      pointer-events: auto;
    }

    .stats-title {
      margin-bottom: 15px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    .vitality-block {
      margin-bottom: 12px;
    }

    .vitality-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .vitality-bar {
      height: 6px;
      margin-top: 6px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .vitality-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg,
        #5bc0eb, #7ddb8c, #ffd166, #ff8c42, #ff4dd8);
      transition: width 1.2s ease;
    }

    .stage-track {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .stage-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      transition: all .4s ease;
    }

    .stage-dot.passed {
      background: rgba(255,255,255,.38);
    }

    .stage-dot.on {
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,.9);
      transform: scale(1.4);
    }

    .tag-pill {
      display: inline-block;
      margin: 0 4px 4px 0;
      padding: 2px 8px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 9px;
      letter-spacing: .02em;
    }

    .badge-source {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.5);
      font-size: 8px;
      letter-spacing: .08em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .stat-value {
      color: rgba(255,255,255,.86);
      font-family: monospace;
      font-size: 13px;
    }

    .hint {
      position: absolute;
      right: 26px;
      bottom: 28px;
      color: rgba(255,255,255,.28);
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 25px;
      color: rgba(255,255,255,.6);
      background: #05060b;
      font-size: 10px;
      letter-spacing: .28em;
      text-align: center;
      transition: opacity .6s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .error-box {
      max-width: 560px;
      padding: 24px;
      border: 1px solid rgba(255,100,120,.35);
      border-radius: 18px;
      color: rgba(255,255,255,.7);
      background: rgba(75,15,28,.28);
      font-family: monospace;
      font-size: 11px;
      letter-spacing: .02em;
      line-height: 1.8;
      text-align: left;
    }

    .error-title {
      margin-bottom: 10px;
      color: #ff9da9;
      font-family: var(--font);
      font-size: 13px;
      letter-spacing: .1em;
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      z-index: 80;
      padding: 10px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: rgba(255,255,255,.75);
      background: rgba(20,24,38,.8);
      font-size: 10px;
      opacity: 0;
      transform: translate(-50%, 12px);
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 650px) {
      .panel {
        top: 14px;
        width: calc(100vw - 24px);
        padding: 16px;
        border-radius: 21px;
      }

      h1 {
        font-size: 23px;
      }

      .address-preview {
        max-width: 120px;
      }

      .input-row {
        flex-direction: column;
      }

      input,
      .generate {
        width: 100%;
      }

      .stats {
        left: 14px;
        bottom: 14px;
        width: 215px;
        padding: 14px;
      }

      .hint {
        right: 14px;
        bottom: 18px;
        font-size: 8px;
      }
    }

    @media (max-width: 420px) {
      .hint {
        display: none;
      }

      .stats {
        width: 190px;
      }

      .stat-value {
        font-size: 11px;
      }
    }
  </style>
</head>

        DRAG TO ROTATE · SCROLL TO ZOOM

    <div id="toast" class="toast"></div>

{

<script type="module">

    const DEFAULT_ADDRESS =

    const app = {
      scene: null,

    function hashString(value) {
      let h1 = 0x811c9dc5;
      let h2 = 0x01000193;

      for (let i = 0; i < value.length; i++) {
        const c = value.charCodeAt(i);

        h1 ^= c;
        h1 = Math.imul(h1, 16777619);

        h2 ^= c + i * 19;
        h2 = Math.imul(h2, 2246822519);
      }

      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
      h2 = Math.imul(h2 ^ (h2 >>> 13), 3266489909);

      return (h1 ^ h2) >>> 0;
    }

    function createRandom(seed) {
      let value = seed >>> 0;

      return function () {
        value += 0x6D2B79F5;

        let t = value;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function validAddress(address) {
      return /^0x[a-fA-F0-9]{40}$/.test(address);
    }

    function shortAddress(address) {
      return address.slice(0, 6) + "..." + address.slice(-4);
    }

    // 随机生命体素材池：Arbitrum One 上真实存在的有趣地址
    // （余额/交易数实测于 2026-08-15，从 0 tx 空地址到 160 万 tx 巨鲸，颜色跨度完整）

      "0xF977814e90dA44bFA03b6295A0616a897441aceC", // Binance 热钱包 · 681 tx · ~10,070 ETH
      "0x0D0707963952f2fBA59dD06f2b425ace40b492Fe", // Gate 热钱包 · 163万 tx · ~2,769 ETH

    function randomAddress() {
      return CURATED_ADDRESSES[
        Math.floor(Math.random() * CURATED_ADDRESSES.length)
      ];

    // ── 真实链上数据：三层回退读取 Arbitrum One ──
    // 1) 直连官方 RPC（支持 CORS，GitHub Pages / 本地均可用）
    // 2) 本地 /rpc 代理（server.js）
    // 3) 两者都失败 → 模拟模式
    const DIRECT_RPC_URL = "https://arb1.arbitrum.io/rpc";

    async function rpcRequest(url, method, params) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
      });

      if (!res.ok) throw new Error("rpc http " + res.status);

      const data = await res.json();

      if (data.error) throw new Error(data.error.message || "rpc error");

      return data.result;
    }

    async function rpc(method, params) {
      try {
        return await rpcRequest(DIRECT_RPC_URL, method, params);
      } catch (directErr) {
        try {
          return await rpcRequest("/rpc", method, params);
        } catch (proxyErr) {
          throw new Error("rpc unreachable");
        }
      }
    }

    // ── Arbitrum One 主流代币注册表（真实持仓资产环） ──
    const ARBITRUM_TOKENS = [
      { symbol: "USDC", address: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831", decimals: 6,  color: 0x2775CA },

    // 批量查询代币余额（eth_call balanceOf），按持仓量降序
    async function fetchTokenBalances(address) {
      const calldata =
        "0x70a08231" + address.slice(2).padStart(64, "0");

      const results = await Promise.all(
        ARBITRUM_TOKENS.map(async (token) => {
          try {
            const hex = await rpc("eth_call", [
              { to: token.address, data: calldata }, "latest"
            ]);
            const amount =
              Number(BigInt(hex)) / Math.pow(10, token.decimals);
            return { ...token, amount };
          } catch {
            return { ...token, amount: 0 };
          }
        })
      );

      return results
        .filter((t) => t.amount > 0)
        .sort((a, b) => b.amount - a.amount)
        .slice(0, 6);
    }

    async function fetchOnchainData(address) {
      const work = (async () => {
        const [balanceWei, txCount, code, blockNumber] =
          await Promise.all([
            rpc("eth_getBalance", [address, "latest"]),
            rpc("eth_getTransactionCount", [address, "latest"]),
            rpc("eth_getCode", [address, "latest"]),
            rpc("eth_blockNumber", [])
          ]);

        return {
          balanceEth: parseInt(balanceWei, 16) / 1e18,
          txCount: parseInt(txCount, 16),
          isContract: code && code !== "0x",
          blockNumber: parseInt(blockNumber, 16),
          network: "Arbitrum One"
        };
      })();

      const timeout = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("rpc timeout")), 8000)
      );

      return Promise.race([work, timeout]);
    }

    const simplex = `
      vec3 mod289(vec3 x) {
        return x - floor(x * (1.0 / 289.0)) * 289.0;
      }

      vec4 mod289(vec4 x) {
        return x - floor(x * (1.0 / 289.0)) * 289.0;
      }

      vec4 permute(vec4 x) {
        return mod289(((x * 34.0) + 1.0) * x);
      }

      vec4 taylorInvSqrt(vec4 r) {
        return 1.79284291400159 - 0.85373472095314 * r;
      }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;

        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod289(i);

        vec4 p = permute(
          permute(
            permute(i.z + vec4(0.0, i1.z, i2.z, 1.0))
            + i.y + vec4(0.0, i1.y, i2.y, 1.0)
          )
          + i.x + vec4(0.0, i1.x, i2.x, 1.0)
        );

        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;

        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(
          dot(p0, p0),
          dot(p1, p1),
          dot(p2, p2),
          dot(p3, p3)
        ));

        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(
          dot(x0, x0),
          dot(x1, x1),
          dot(x2, x2),
          dot(x3, x3)
        ), 0.0);

        m *= m;

        return 42.0 * dot(
          m * m,
          vec4(
            dot(p0, x0),
            dot(p1, x1),
            dot(p2, x2),
            dot(p3, x3)
          )
        );
      }
    `;

    const VignetteShader = {
      uniforms: {
        tDiffuse: { value: null },
        darkness: { value: 1.25 },
        offset: { value: 1.08 }
      },

      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float darkness;
        uniform float offset;

        varying vec2 vUv;

        void main() {
          vec4 color = texture2D(tDiffuse, vUv);

          vec2 uv = (vUv - .5) * offset;
          float vignette = smoothstep(.1, .82, dot(uv, uv));

          color.rgb *= mix(
            1.0,
            1.0 - darkness * .42,
            vignette
          );

          gl_FragColor = color;
        }
      `
    };

    function createConfig(address, onchain) {
      const seed = hashString(address.toLowerCase());
      const rng = createRandom(seed);

      // ── 9阶段生命周期 ──
      const LIFECYCLE = [
        { name:'Primordial', minTx:0,    hue:0.60 },
        { name:'Emerged',    minTx:10,   hue:0.55 },
        { name:'Awakening',  minTx:50,   hue:0.48 },
        { name:'Growing',    minTx:150,  hue:0.40 },
        { name:'Thriving',   minTx:400,  hue:0.25 },
        { name:'Mature',     minTx:1000, hue:0.14 },
        { name:'Intense',    minTx:2500, hue:0.07 },
        { name:'Radiant',    minTx:5000, hue:0.02 },
        { name:'Ancient',    minTx:8000, hue:0.95 },
      ];

      // 链上能量驱动生命阶段：余额加权(财富即岁月) + EOA 真实交易数。
      // RPC 不可用时回退到哈希模拟。
      let simTx = 1 + Math.floor(rng() * 15000);
      let energy = simTx;
      let balanceEth = null;
      let isContract = false;
      let real = false;

      if (onchain) {
        real = true;
        balanceEth = onchain.balanceEth;
        isContract = onchain.isContract;
        const balanceBoost =
          Math.min(8000, Math.round((balanceEth || 0) * 400));
        // 合约地址的 nonce 只统计合约创建数，不纳入能量
        const txPart = isContract ? 0 : onchain.txCount;
        energy = balanceBoost + txPart;
        simTx = isContract ? 0 : onchain.txCount;
      }

      let targetStage = 0;
      for (let i = 8; i >= 0; i--) { if (energy >= LIFECYCLE[i].minTx) { targetStage = i; break; } }
      // 每个地址叠加微小色相偏移，保持个体独特性
      const hueJitter = (rng() - 0.5) * 0.05;
      const targetHue =
        ((LIFECYCLE[targetStage].hue + hueJitter) % 1 + 1) % 1;
      const stageName = LIFECYCLE[targetStage].name;

      // ── LDR 色彩预算（8 位管线）：高饱和 + 高亮度 ──
      // 红/品红系在深蓝底上容易浑浊，专项提亮加饱和
      let lightness = 0.62 + rng() * 0.06;
      let saturation = 0.85;
      if (targetHue < 0.08 || targetHue > 0.9) {
        lightness += 0.06;
        saturation = Math.min(1, saturation + 0.08);
      }

      const color = new THREE.Color();
      color.setHSL(targetHue, saturation, lightness);

      const vitality = real
        ? Math.min(99, 55 +
            Math.round(Math.log10(1 + (balanceEth || 0)) * 6 +
              (simTx > 0 ? 8 : 0) + (isContract ? 10 : 0)))
        : 62 + Math.floor(rng() * 38);

      // ── 形态分化：按 能量层级 × 身份 决定物种特征 ──
      let radius = 1.55 + rng() * .2;
      let rotation = .03 + rng() * .05;
      let particleCount = 900 + Math.floor(rng() * 700);
      let trailCount = 220 + Math.floor(rng() * 130);
      let distortion = .08 + rng() * .16;
      let pulse = 1.2 + rng() * 1.3;
      let ringCount = 0;
      let cage = false;

      if (isContract) {
        // 合约：晶体几何化 + 线框笼
        distortion *= 1.6;
        rotation *= .8;
        cage = true;
        ringCount = 1;
      }

      if (energy >= 8000 || (balanceEth || 0) >= 1000) {
        // 泰坦：更大、更慢、三层光环
        radius += .3;
        rotation *= .45;
        trailCount = Math.floor(trailCount * 1.3);
        particleCount = Math.floor(particleCount * 1.1);
        ringCount = Math.max(ringCount, 3);
      } else if (energy >= 2000) {
        radius += .18;
        rotation *= .6;
        ringCount = Math.max(ringCount, 2);
      } else if (energy >= 500) {
        rotation *= 1.15;
        particleCount = Math.floor(particleCount * 1.25);
        ringCount = Math.max(ringCount, 1);
      } else if (energy < 50) {
        // 沉睡/空白：更小、更慢、更稀疏
        radius -= .1;
        rotation *= .5;
        pulse *= .7;
        particleCount = Math.floor(particleCount * .6);
        trailCount = Math.floor(trailCount * .7);
      }

      if (address.toLowerCase() ===
          "0x0000000000000000000000000000000000000000") {
        // 万物坟墓：极慢、三层暗环
        rotation *= .3;
        ringCount = 3;
      }

      return {
        seed,
        color, targetStage, targetHue, stageName, simTx, energy,
        real, balanceEth, isContract,
        zeroAddress:
          address.toLowerCase() ===
          "0x0000000000000000000000000000000000000000",
        radius,
        noiseScale: 1.3 + rng() * 1.4,
        distortion,
        pulse,
        rotation,
        particleCount,
        trailCount,
        spread: 1.9 + rng() * .35,
        ringCount,
        cage,
        vitality
      };
    }

    function createShellMaterial(config) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uScale: { value: config.noiseScale },
          uDistortion: { value: config.distortion },
          uPulse: { value: config.pulse },
          uColor: { value: config.color }
        },

        vertexShader: `
          uniform float uTime;
          uniform float uScale;
          uniform float uDistortion;
          uniform float uPulse;

          varying float vNoise;
          varying vec3 vNormalWorld;

          ${simplex}

          void main() {
            vec3 direction = normalize(position);

            float n1 = snoise(
              direction * uScale +
              vec3(uTime * .12, uTime * .15, uTime * .1)
            );

            float n2 = snoise(
              direction * uScale * 2.3 -
              vec3(uTime * .18, uTime * .12, uTime * .2)
            );

            float breathe =
              1.0 +
              sin(uTime * uPulse) * .04 +
              sin(uTime * uPulse * .43) * .015;

            float displacement =
              n1 * uDistortion +
              n2 * uDistortion * .22;

            vec3 transformed =
              position * breathe +
              direction * displacement;

            vec4 worldPosition =
              modelMatrix * vec4(transformed, 1.0);

            vNoise = n1 * .5 + .5;
            vNormalWorld = normalize(mat3(modelMatrix) * normal);

            gl_Position =
              projectionMatrix *
              viewMatrix *
              worldPosition;
          }
        `,

        fragmentShader: `
          uniform vec3 uColor;

          varying float vNoise;
          varying vec3 vNormalWorld;

          void main() {
            float edge = pow(1.0 - abs(vNormalWorld.z), 1.5);
            float energy = .55 + vNoise * .35 + edge * .6;

            vec3 hdrColor = uColor * energy * 1.15;

            gl_FragColor = vec4(hdrColor, .22);
          }
        `,

        wireframe: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
    }

    function createCoreMaterial(config) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPulse: { value: config.pulse },
          uColor: { value: config.color }
        },

        vertexShader: `
          uniform float uTime;
          uniform float uPulse;

          varying vec3 vNormalView;

          void main() {
            float breath =
              1.0 +
              sin(uTime * uPulse) * .025 +
              sin(uTime * uPulse * .5) * .012;

            vec3 transformed = position * breath;

            vec4 viewPosition =
              modelViewMatrix * vec4(transformed, 1.0);

            vNormalView = normalize(normalMatrix * normal);

            gl_Position =
              projectionMatrix * viewPosition;
          }
        `,

        fragmentShader: `
          uniform vec3 uColor;

          varying vec3 vNormalView;

          void main() {
            float fresnel =
              pow(1.0 - abs(vNormalView.z), 2.1);

            float energy = .25 + fresnel * 1.1;
            vec3 hdrColor = uColor * energy * 1.15;

            gl_FragColor =
              vec4(hdrColor, .14 + fresnel * .24);
          }
        `,

        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
    }

    function createParticles(config) {
      const count = config.particleCount;
      const rng = createRandom(config.seed ^ 0x9e3779b9);

      const positions = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const lives = new Float32Array(count);
      const phases = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const index = i * 3;
        const theta = rng() * Math.PI * 2;
        const phi = Math.acos(2 * rng() - 1);
        const radius = config.spread + (rng() - .5) * .55;

        positions[index] =
          radius * Math.sin(phi) * Math.cos(theta);

        positions[index + 1] =
          radius * Math.sin(phi) * Math.sin(theta);

        positions[index + 2] =
          radius * Math.cos(phi);

        sizes[i] = .55 + rng() * 1.2;
        lives[i] = rng();
        phases[i] = rng();
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
      );

      geometry.setAttribute(
        "aSize",
        new THREE.BufferAttribute(sizes, 1)
      );

      geometry.setAttribute(
        "aLife",
        new THREE.BufferAttribute(lives, 1)
      );

      geometry.setAttribute(
        "aPhase",
        new THREE.BufferAttribute(phases, 1)
      );

      const material = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: config.color },
          uPixelRatio: {
            value: Math.min(window.devicePixelRatio, 1.5)
          }
        },

        vertexShader: `
          attribute float aSize;
          attribute float aLife;
          attribute float aPhase;

          uniform float uTime;
          uniform float uPixelRatio;

          varying float vLife;

          void main() {
            float life =
              fract(aLife + uTime * (.045 + aPhase * .025));

            float fadeIn = smoothstep(0.0, .14, life);
            float fadeOut = 1.0 - smoothstep(.67, 1.0, life);

            vec3 transformed = position;

            float angle =
              uTime * (.12 + aPhase * .18);

            float c = cos(angle);
            float s = sin(angle);

            transformed.xz =
              mat2(c, -s, s, c) * transformed.xz;

            transformed += normalize(transformed) *
              sin(uTime * 1.4 + aPhase * 18.0) * .04;

            vec4 mvPosition =
              modelViewMatrix * vec4(transformed, 1.0);

            float depth =
              1.0 / max(.1, -mvPosition.z);

            gl_PointSize =
              aSize * uPixelRatio * depth * 34.0 *
              fadeIn * fadeOut;

            vLife = fadeIn * fadeOut;

            gl_Position =
              projectionMatrix * mvPosition;
          }
        `,

        fragmentShader: `
          uniform vec3 uColor;

          varying float vLife;

          void main() {
            vec2 uv = gl_PointCoord - .5;
            float distanceToCenter = length(uv);

            float soft =
              1.0 - smoothstep(.08, .5, distanceToCenter);

            float core =
              1.0 - smoothstep(0.0, .18, distanceToCenter);

            float alpha =
              (soft * .72 + core * .68) * vLife;

            vec3 hdrColor =
              uColor * (1.05 + core * 1.9);

            gl_FragColor =
              vec4(hdrColor, alpha);
          }
        `,

        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const points =
        new THREE.Points(geometry, material);

      points.renderOrder = 5;

      return points;
    }

    function createTrails(config) {
      const count = config.trailCount;
      const rng = createRandom(config.seed ^ 0x85ebca6b);

      const positions = new Float32Array(count * 2 * 3);
      const lives = new Float32Array(count * 2);
      const sides = new Float32Array(count * 2);

      for (let i = 0; i < count; i++) {
        const theta = rng() * Math.PI * 2;
        const phi = Math.acos(2 * rng() - 1);

        const x = Math.sin(phi) * Math.cos(theta);
        const y = Math.sin(phi) * Math.sin(theta);
        const z = Math.cos(phi);

        const r1 = config.spread + .08 + rng() * .2;
        const r2 = r1 + .15 + rng() * .42;

        const index = i * 6;

        positions[index] = x * r1;
        positions[index + 1] = y * r1;
        positions[index + 2] = z * r1;

        positions[index + 3] = x * r2;
        positions[index + 4] = y * r2;
        positions[index + 5] = z * r2;

        const life = rng();

        lives[i * 2] = life;
        lives[i * 2 + 1] = life;
        sides[i * 2] = 0;
        sides[i * 2 + 1] = 1;
      }

      const geometry = new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
      );

      geometry.setAttribute(
        "aLife",
        new THREE.BufferAttribute(lives, 1)
      );

      geometry.setAttribute(
        "aSide",
        new THREE.BufferAttribute(sides, 1)
      );

      const material = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uColor: { value: config.color }
        },

        vertexShader: `
          attribute float aLife;
          attribute float aSide;

          uniform float uTime;

          varying float vAlpha;

          void main() {
            float life =
              fract(aLife + uTime * .043);

            float fade =
              smoothstep(0.0, .16, life) *
              (1.0 - smoothstep(.66, 1.0, life));

            vec4 viewPosition =
              modelViewMatrix * vec4(position, 1.0);

            vAlpha =
              fade * (.2 + aSide * .18);

            gl_Position =
              projectionMatrix * viewPosition;
          }
        `,

        fragmentShader: `
          uniform vec3 uColor;
          varying float vAlpha;

          void main() {
            gl_FragColor =
              vec4(uColor * 1.2, vAlpha);
          }
        `,

        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      const lines =
        new THREE.LineSegments(geometry, material);

      lines.renderOrder = 4;

      return lines;
    }

    // ── 真实资产环：持有代币 → 环绕卫星 ──
    function createAssetRing(assets) {
      const group = new THREE.Group();
      const satellites = [];

      assets.forEach((asset, i) => {
        const count = assets.length;
        const orbitRadius = 2.45 + i * 0.18;
        const size =
          0.07 + Math.min(0.14, Math.log10(1 + asset.amount) * 0.03);

        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(1, 14, 14),
          new THREE.MeshBasicMaterial({ color: asset.color })
        );

        mesh.scale.setScalar(size);
        mesh.renderOrder = 3;
        mesh.userData = {
          symbol: asset.symbol,
          orbitRadius,
          orbitPhase: (i / count) * Math.PI * 2,
          orbitSpeed: 0.5 - i * 0.04,
          orbitTilt: 0.3 + (i % 2) * 0.15
        };

        group.add(mesh);
        satellites.push(mesh);
      });

      return { group, satellites };
    }

    // ── 形态光环：泰坦/巨鲸的多层环 ──
    function createMorphRings(count, radiusBase, config) {
      const group = new THREE.Group();

      for (let i = 0; i < count; i++) {
        const torus = new THREE.Mesh(
          new THREE.TorusGeometry(radiusBase + i * 0.24, 0.009, 8, 90),
          new THREE.MeshBasicMaterial({
            color: config.color,
            transparent: true,
            opacity: 0.4 + (count - i) * 0.08
          })
        );

        torus.rotation.x = Math.PI / 2 + i * 0.4;
        torus.rotation.y = i * 0.7;
        torus.userData.rx = (i % 2 ? 1 : -1) * (0.0008 + i * 0.0005);
        torus.userData.ry = 0.0006 + i * 0.0004;
        group.add(torus);
      }

      return group;
    }

    // ── 合约晶体笼 ──
    function createCage(config) {
      return new THREE.Mesh(
        new THREE.IcosahedronGeometry(config.radius * 1.28, 1),
        new THREE.MeshBasicMaterial({
          color: config.color,
          wireframe: true,
          transparent: true,
          opacity: 0.22
        })
      );
    }

    function disposeObject(object) {
      if (!object) return;

      object.traverse((child) => {
        if (child.geometry) {
          child.geometry.dispose();
        }

        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach((m) => m.dispose());
          } else {
            child.material.dispose();
          }
        }
      });
    }

    async function createOrganism(address) {
      let onchain = null;

      try {
        onchain = await fetchOnchainData(address);
      } catch (error) {
        console.warn("链上数据获取失败，回退到模拟模式:", error);
      }

      // 资产环独立查询：失败不影响主体
      let assets = [];
      try {
        assets = await fetchTokenBalances(address);
      } catch (error) {
        console.warn("资产查询失败:", error);
      }

      const config = createConfig(address, onchain);
      config.assets = assets;

      if (app.organism) {
        app.scene.remove(app.organism);
        disposeObject(app.organism);
      }

      const group = new THREE.Group();

      const shell = new THREE.Mesh(
        new THREE.IcosahedronGeometry(config.radius, 4),
        createShellMaterial(config)
      );

      const core = new THREE.Mesh(
        new THREE.IcosahedronGeometry(config.radius * .87, 4),
        createCoreMaterial(config)
      );

      const trails = createTrails(config);
      const particles = createParticles(config);
      const assetRing = createAssetRing(assets);
      const morphRings = createMorphRings(
        config.ringCount, config.radius + 0.35, config
      );

      group.add(core);
      group.add(trails);
      group.add(shell);
      group.add(particles);
      group.add(assetRing.group);
      group.add(morphRings);

      if (config.cage) group.add(createCage(config));

      app.scene.add(group);

      // 固定渲染顺序，避免透明物体每帧按距离重排导致视觉抖动
      core.renderOrder = -1;
      shell.renderOrder = 0;

      app.organism = group;
      app.shell = shell;
      app.core = core;
      app.trails = trails;
      app.particles = particles;
      app.assetRing = assetRing.group;
      app.morphRings = morphRings;
      app.config = config;

      // ── Smooth birth: scale + particle fade-in ──
      // 初始冷白 → 目标色
      app.birthHue = 0.60;
      app.birthColor = new THREE.Color().setHSL(0.60, 0.3, 0.85);
      app.targetHue = config.targetHue;
      app.targetColor = config.color.clone();
      app.stageName = config.stageName;
      app.targetStage = config.targetStage;
      app.organism.scale.setScalar(0.5);
      if (app.assetRing) app.assetRing.visible = false;
      if (app.particles) { app.particles.material.opacity = 0; app.particles.material.uniforms.uColor.value.copy(app.birthColor); }
      if (app.trails) { app.trails.material.opacity = 0; app.trails.material.uniforms.uColor.value.copy(app.birthColor); }
      if (app.shell) { app.shell.material.opacity = 0; app.shell.material.uniforms.uColor.value.copy(app.birthColor); }
      if (app.core) app.core.material.uniforms.uColor.value.copy(app.birthColor);
      app.evolutionStart = performance.now() / 1000;

      updateStats(address, config, onchain);
    }

    function initThree() {
      app.scene = new THREE.Scene();

      app.camera = new THREE.PerspectiveCamera(
        46,
        window.innerWidth / window.innerHeight,
        .1,
        100
      );

      app.camera.position.set(0, 0, app.currentZoom);

      app.renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
      });

      // 上限 1.5 倍像素比：视网膜屏上比 2.0 少 ~44% 像素，bloom 后处理更流畅
      app.renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
      );

      app.renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      app.renderer.setClearColor(0x05060b, 1); app.renderer.setClearAlpha(1);

      app.renderer.outputColorSpace =
        THREE.SRGBColorSpace;

      app.renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

      app.renderer.toneMappingExposure = 0.85;

      document.getElementById("canvas-wrap")
        .appendChild(app.renderer.domElement);

      const renderPass = new RenderPass(
        app.scene,
        app.camera
      );

      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(
          window.innerWidth,
          window.innerHeight
        ),
        0.8,
        0.55,
        .16
      );

      bloomPass.threshold = .32;
      bloomPass.strength = 0.8;
      bloomPass.radius = .55;

      // ── macOS Chrome (Metal/ANGLE) 半浮点渲染目标有随机黑块伪影 ──
      // 把 bloom 内部目标与 composer 目标全部强制为 8 位，规避驱动 bug
      [
        bloomPass.renderTargetBright,
        ...bloomPass.renderTargetsHorizontal,
        ...bloomPass.renderTargetsVertical
      ].forEach((rt) => {
        if (rt) {
          rt.type = THREE.UnsignedByteType;
          if (rt.texture) rt.texture.type = THREE.UnsignedByteType;
        }
      });

      const composerTarget = new THREE.WebGLRenderTarget(
        1, 1,
        { type: THREE.UnsignedByteType }
      );

      const vignettePass =
        new ShaderPass(VignetteShader);

      // ── 色彩分级：饱和度增强 + 柔和 S 曲线 + 高光微提 ──
      // 8 位管线里找回"电影感"的关键一步
      const gradePass = new ShaderPass({
        uniforms: {
          tDiffuse: { value: null }
        },

        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,

        fragmentShader: `
          uniform sampler2D tDiffuse;
          varying vec2 vUv;

          void main() {
            vec3 c = texture2D(tDiffuse, vUv).rgb;

            float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
            c = mix(vec3(l), c, 1.15);
            c = c * c * (3.0 - 2.0 * c) * 0.7 + c * 0.3;
            c = c + (1.0 - c) * c * 0.05;

            gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
          }
        `
      });

      app.composer =
        new EffectComposer(app.renderer, composerTarget);
      app.composer.addPass(renderPass);
      app.composer.addPass(bloomPass);
      app.composer.addPass(vignettePass);
      app.composer.addPass(gradePass);
      app.composer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      window.addEventListener("resize", resize);
      setupControls();
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      app.camera.aspect = width / height;
      app.camera.updateProjectionMatrix();

      app.renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
      );
      app.renderer.setSize(width, height);
      app.composer.setSize(width, height);

      if (app.particles) {
        app.particles.material.uniforms.uPixelRatio.value =
          Math.min(window.devicePixelRatio, 1.5);
      }
    }

    function setupControls() {
      const canvas = app.renderer.domElement;

      canvas.addEventListener("pointerdown", (event) => {
        app.dragging = true;
        app.lastX = event.clientX;
        app.lastY = event.clientY;
        app.downX = event.clientX;
        app.downY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!app.dragging) return;

        const dx = event.clientX - app.lastX;
        const dy = event.clientY - app.lastY;

        app.targetY += dx * .005;
        app.targetX += dy * .004;

        app.targetX = Math.max(
          -.7,
          Math.min(.7, app.targetX)
        );

        app.lastX = event.clientX;
        app.lastY = event.clientY;
      });

      canvas.addEventListener("pointerup", (event) => {
        // 未拖动视为点击：激发一次呼吸脉冲
        const dx = event.clientX - app.downX;
        const dy = event.clientY - app.downY;
        if (Math.abs(dx) + Math.abs(dy) < 6) {
          app.pulseBoost = 1;
        }
        app.dragging = false;
      });

      canvas.addEventListener("pointercancel", () => {
        app.dragging = false;
      });

      canvas.addEventListener("wheel", (event) => {
        event.preventDefault();

        app.targetZoom += event.deltaY * .004;

        app.targetZoom = Math.max(
          3.7,
          Math.min(8.4, app.targetZoom)
        );
      }, { passive: false });
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = app.clock.getElapsedTime();

      app.currentX +=
        (app.targetX - app.currentX) * .055;

      app.currentY +=
        (app.targetY - app.currentY) * .055;

      app.currentZoom +=
        (app.targetZoom - app.currentZoom) * .07;

      app.camera.position.z = app.currentZoom;

      if (app.organism) {
        app.organism.rotation.x =
          app.currentX + Math.sin(time * .2) * .025;

        app.organism.rotation.y =
          app.currentY + time * app.config.rotation;

        app.organism.rotation.z =
          Math.sin(time * .22) * .035;

        app.organism.position.y =
          Math.sin(time * .72) * .045;
      }

      if (app.shell) {
        app.shell.material.uniforms.uTime.value = time;
      }

      if (app.core) {
        app.core.material.uniforms.uTime.value = time;
      }

      if (app.particles) {
        app.particles.material.uniforms.uTime.value = time;
      }

      if (app.trails) {
        app.trails.material.uniforms.uTime.value = time;
      }

      // ── Smooth birth: color drift + fade + scale (bloom disabled during animation) ──
      if (app.evolutionStart && app.organism) {
        const elapsed = (performance.now() / 1000) - app.evolutionStart;
        const raw = Math.min(1, elapsed / 5.0);
        const eased = raw < 0.5 ? 4*raw*raw*raw : 1 - Math.pow(-2*raw+2,3)/2;
        const done = raw >= 1;
        const s = done ? 1.0 : (0.5 + eased * 0.5);
        app.birthScale = s;
        if (app.particles) { app.particles.material.opacity = done ? 0.85 : eased * 0.85; app.particles.material.uniforms.uColor.value.copy(app.birthColor).lerp(app.targetColor, eased); }
        if (app.trails) { app.trails.material.opacity = done ? 0.5 : eased * 0.5; app.trails.material.uniforms.uColor.value.copy(app.birthColor).lerp(app.targetColor, eased); }
        if (app.shell) { app.shell.material.opacity = done ? 0.75 : eased * 0.75; app.shell.material.uniforms.uColor.value.copy(app.birthColor).lerp(app.targetColor, eased); }
        if (app.core) app.core.material.uniforms.uColor.value.copy(app.birthColor).lerp(app.targetColor, eased);
        const cs = Math.floor(eased * (app.targetStage||0));
        const stages = ['Primordial','Emerged','Awakening','Growing','Thriving','Mature','Intense','Radiant','Ancient'];
        // 仅当阶段序号变化时才更新 DOM，避免演化期间每帧触发布局
        if (cs !== app.lastStageTick || done !== app.lastStageDone) {
          app.lastStageTick = cs;
          app.lastStageDone = done;
          document.getElementById('particleCount').textContent = done ? (app.stageName||'') : ((stages[cs]||'') + ' → ' + (app.stageName||''));
          renderStageDots(cs);
        }
        if (done && app.evolutionStart) {
          app.evolutionStart = 0;
          if (app.assetRing) app.assetRing.visible = true;
        }
      }

            // Smooth bloom fade-in during evolution
      let bloomTarget = 0.8 + (app.pulseBoost || 0) * 0.8;
      if (app.evolutionStart && app.evolutionStart > 0) {
        const elapsed = (performance.now() / 1000) - app.evolutionStart;
        const raw = Math.min(1, elapsed / 5.0);
        const eased = raw < 0.5 ? 4*raw*raw*raw : 1 - Math.pow(-2*raw+2,3)/2;
        // Find bloom pass and smoothly increase
        app.composer.passes.forEach(p => {
          if (p.strength !== undefined) p.strength = 0.05 + eased * (bloomTarget - 0.05);
        });
      } else {
        // 双向平滑追随目标强度（脉冲冲高后回落）
        app.composer.passes.forEach(p => {
          if (p.strength !== undefined) {
            p.strength += (bloomTarget - p.strength) * 0.06;
          }
        });
      }

      // ── 点击脉冲衰减 + 呼吸缩放 ──
      if (app.pulseBoost > 0) {
        app.pulseBoost = Math.max(0, app.pulseBoost - 0.04);
      }
      if (app.organism) {
        app.organism.scale.setScalar(
          (app.birthScale || 1) *
          (1 + (app.pulseBoost || 0) * 0.07)
        );
      }
            // ── 形态光环自转 ──
      if (app.morphRings) {
        for (const ring of app.morphRings.children) {
          ring.rotation.x += ring.userData.rx;
          ring.rotation.y += ring.userData.ry;
        }
      }

            // ── 资产环卫星旋转 ──
      if (app.assetRing) {
        const time2 = app.clock.getElapsedTime();
        for (const sat of app.assetRing.children) {
          const phase = sat.userData.orbitPhase + time2 * sat.userData.orbitSpeed;
          const r = sat.userData.orbitRadius;
          const tilt = sat.userData.orbitTilt;
          sat.position.x = Math.cos(phase) * r;
          sat.position.y = Math.sin(phase) * Math.sin(tilt) * r;
          sat.position.z = Math.sin(phase) * Math.cos(tilt) * r;
        }
      }

            // ── 远景星尘慢转 ──
      if (app.starDust) {
        app.starDust.rotation.y += 0.0003;
        app.starDust.rotation.x += 0.0001;
      }
      if (app.starDust2) {
        app.starDust2.rotation.y -= 0.0002;
        app.starDust2.rotation.z += 0.00015;
      if (app.nebulaDust) {
        app.nebulaDust.rotation.y += 0.0005;
        app.nebulaDust.rotation.x += 0.0003;
      }
      }

      app.composer.render();
    }

      const input = document.getElementById("addressInput");
      const address = input.value.trim();

        input.style.borderColor = "rgba(255,80,110,.85)";
        document.getElementById("statusText").textContent =
          "INVALID ADDRESS";

        setTimeout(() => {
          input.style.borderColor = "";
          document.getElementById("statusText").textContent =
            "LIFEFORM ACTIVE";
        }, 1200);

        return;
      }

      try {
        await createOrganism(address);

        console.error(error);
        showToast("生成失败");
      }

    // ── 历史记录（localStorage） ──
    const HISTORY_KEY = "chainlife-history";

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveHistory(address) {
      const list = loadHistory().filter((a) => a !== address);
      list.unshift(address);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 10)));
      renderHistory();
    }

    function renderHistory() {
      const strip = document.getElementById("historyStrip");
      if (!strip) return;

      const list = loadHistory();
      strip.textContent = "";
      if (!list.length) {
        strip.style.display = "none";
        return;
      }

      strip.style.display = "flex";
      list.forEach((addr) => {
        const chip = document.createElement("button");
        chip.className = "history-chip";
        chip.textContent = shortAddress(addr);
        chip.title = addr;
        chip.addEventListener("click", () => {
          document.getElementById("addressInput").value = addr;
          generate();
        });
        strip.appendChild(chip);
      });
    }

    function createStarDust() {
      const count = 2000;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 5 + Math.random() * 40;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i*3] = r * Math.sin(ph) * Math.cos(th);
        pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
        pos[i*3+2] = r * Math.cos(ph);
        const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.15, 0.3, 0.3 + Math.random() * 0.4);
        col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.6, vertexColors: true, transparent: true, opacity: 0.7,
        blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
      });
      app.starDust = new THREE.Points(geo, mat);
      app.scene.add(app.starDust);

      // Second layer: larger, dimmer, slower
      const geo2 = new THREE.BufferGeometry();
      const pos2 = new Float32Array(400 * 3);
      for (let i = 0; i < 400; i++) {
        const r = 8 + Math.random() * 50;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos2[i*3] = r * Math.sin(ph) * Math.cos(th);
        pos2[i*3+1] = r * Math.sin(ph) * Math.sin(th);
        pos2[i*3+2] = r * Math.cos(ph);
      }
      geo2.setAttribute('position', new THREE.BufferAttribute(pos2, 3));
      const mat2 = new THREE.PointsMaterial({
        size: 0.9, color: 0x446688, transparent: true, opacity: 0.35,
        blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
      });
      app.starDust2 = new THREE.Points(geo2, mat2);

      // Nebula cloud: large soft particles
      const geo3 = new THREE.BufferGeometry();
      const pos3 = new Float32Array(200 * 3);
      for (let i = 0; i < 200; i++) {
        const r = 4 + Math.random() * 12;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos3[i*3] = r * Math.sin(ph) * Math.cos(th);
        pos3[i*3+1] = r * Math.sin(ph) * Math.sin(th);
        pos3[i*3+2] = r * Math.cos(ph);
      }
      geo3.setAttribute('position', new THREE.BufferAttribute(pos3, 3));
      const nebulaTex = (() => { const c=document.createElement('canvas'); c.width=c.height=64; const ctx=c.getContext('2d'); const g=ctx.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,0.6)'); g.addColorStop(0.2,'rgba(255,255,255,0.2)'); g.addColorStop(0.5,'rgba(100,150,255,0.05)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
      const mat3 = new THREE.PointsMaterial({
        size: 2.5, map: nebulaTex, color: 0x8899cc,
        transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending,
        depthWrite: false, sizeAttenuation: true
      });
      app.nebulaDust = new THREE.Points(geo3, mat3);
      app.scene.add(app.nebulaDust);
      app.scene.add(app.starDust2);
    }

    // ── 钱包原型系统：活跃度 × 财富 × 身份 三维分类 ──
    function generateWalletProfile(config) {
      const e = config.energy || config.simTx || 0;
      const tx = config.simTx || 0;
      const bal = config.balanceEth;
      const isContract = !!config.isContract;

      let role, icon, age, accent;
      const tags = [];

      if (config.zeroAddress) {
        role = "万物坟墓 The Void";
        icon = "🕳️";
        accent = "#8b6bff";
        age = "虚无";
        tags.push("零地址", "焚烧归集");
      } else if (isContract) {
        if (bal >= 1000) {
          role = "机构金库 Institutional Vault";
          icon = "🏦"; accent = "#ff5c5c"; age = "巨量储备";
          tags.push("机构级储备", "资金中枢");
        } else if (bal >= 10) {
          role = "协议中枢 Protocol Nexus";
          icon = "⚙️"; accent = "#5ce1e6"; age = "协议骨干";
          tags.push("协议核心", "生态枢纽");
        } else if (bal > 0) {
          role = "活跃合约 Active Contract";
          icon = "🔩"; accent = "#7ddb8c"; age = "运行中";
          tags.push("链上合约", "持续运转");
        } else {
          role = "冷合约 Cold Contract";
          icon = "🧊"; accent = "#8ea2b8"; age = "沉寂";
          tags.push("无余额", "待唤醒");
        }
      } else {
        if (e >= 8000) {
          role = "远古存在 Ancient";
          icon = "🐉"; accent = "#ff4dd8"; age = "远古";
          tags.push("见证历史", "OG级地址");
        } else if (e >= 2000) {
          role = "巨鲸 Whale";
          icon = "🐋"; accent = "#ff8c42"; age = "巅峰期";
          tags.push("海量交易", "链上影响力");
        } else if (e >= 500) {
          role = "深度玩家 Power User";
          icon = "🎮"; accent = "#ffd166"; age = "成熟期";
          tags.push("频繁交互", "多协议活跃");
        } else if (e >= 150) {
          role = "活跃用户 Active";
          icon = "⚡"; accent = "#7ddb8c"; age = "成长期";
          tags.push("定期交易", "DeFi 常客");
        } else if (e >= 50) {
          role = "探索者 Explorer";
          icon = "🧭"; accent = "#5bc0eb"; age = "初入链";
          tags.push("偶尔交互", "谨慎试探");
        } else if (e >= 10) {
          role = "初学者 Beginner";
          icon = "🌱"; accent = "#9be8ff"; age = "萌芽期";
          tags.push("刚刚起步", "链上学习");
        } else if (bal > 0) {
          role = "潜眠者 Dormant";
          icon = "🌙"; accent = "#c9b8ff"; age = "沉睡期";
          tags.push("持有资产", "静待觉醒");
        } else {
          role = "空白之卵 Empty Egg";
          icon = "🥚"; accent = "#c9d6e5"; age = "待孵化";
          tags.push("全新地址", "尚无足迹");
        }

        // 组合标签：活跃 × 财富 交叉特征
        if (tx >= 100 && bal !== null && bal < 0.5)
          tags.push("空投猎人");
        if (tx < 20 && bal !== null && bal >= 10)
          tags.push("囤币大户 HODLer");
        if (tx >= 1000 && bal !== null && bal >= 100)
          tags.push("鲸群核心");
        if (bal !== null && bal >= 1 && tx >= 20 && tx < 100)
          tags.push("财富积累中");
      }

      return { role, icon, tags, age, tx, accent };
    }

    // ── 9 阶段点阵 ──
    const STAGE_NAMES =
      ['Primordial','Emerged','Awakening','Growing',
       'Thriving','Mature','Intense','Radiant','Ancient'];

    function renderStageDots(current) {
      const track = document.getElementById("stageTrack");
      if (!track) return;

      if (!track.children.length) {
        STAGE_NAMES.forEach((name) => {
          const dot = document.createElement("div");
          dot.className = "stage-dot";
          dot.title = name;
          track.appendChild(dot);
        });
      }

      [...track.children].forEach((dot, i) => {
        dot.className = "stage-dot" +
          (i < current ? " passed" : "") +
          (i === current ? " on" : "");
      });
    }

    async function main() {
      try {
        initThree();

        const input =
          document.getElementById("addressInput");

        document.getElementById("generateButton")
          .addEventListener("click", generate);

        document.getElementById("randomButton")
          .addEventListener("click", () => {
            input.value = randomAddress();
            generate();
          });

        document.getElementById("copyButton")
          .addEventListener("click", copyAddress);

        document.getElementById("mintButton")
          .addEventListener("click", mintNFT);

        document.getElementById("connectButton")
          .addEventListener("click", connectWallet);

        renderHistory();

        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            generate();
          }
        });

        createOrganism(DEFAULT_ADDRESS);
        animate();

        setTimeout(() => {
          document.getElementById("loading")
            .classList.add("hidden");
        }, 700);
      } catch (error) {
        showError(error);
      }
    }

    main();
  </script>
